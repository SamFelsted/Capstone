[platformio]
default_envs = esp32dev, teensy41

[env]
framework = arduino
build_flags =
  -std=gnu++17
  -Iinclude
build_unflags =
  -std=gnu++11
  -std=gnu++14
monitor_speed = 115200

; These environments intentionally do not define
; MELTY_ENABLE_REFERENCE_HARDWARE. Add it only after reviewing the wiring,
; calibration, failsafes, and containment documented in docs/implementation.md.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev

[env:teensy41]
platform = teensy@4.18.0
board = teensy41
